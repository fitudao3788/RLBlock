name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RLBLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::secrets.RLBLOCK_KEYSTORE_BASE64 is not set (refusing to publish a debug-signed APK)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          ORG_GRADLE_PROJECT_RLBLOCK_STORE_FILE: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_RLBLOCK_STORE_PASSWORD: ${{ secrets.RLBLOCK_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RLBLOCK_KEY_ALIAS: ${{ secrets.RLBLOCK_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RLBLOCK_KEY_PASSWORD: ${{ secrets.RLBLOCK_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          cp app/build/outputs/apk/release/app-release.apk "RLBlock-${TAG}.apk"

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" RLBlock-*.apk --clobber

      - name: Upload artifact (manual run)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: RLBlock-apk
          path: RLBlock-*.apk
