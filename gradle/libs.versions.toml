[versions]
agp = "9.2.1"
kotlin = "2.2.10"
xposed-api = "102.0.0"
xposed-service = "102.0.0"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"

[plugins]
agp-app = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[libraries]
libxposed-api = { group = "io.github.libxposed", name = "api", version.ref = "xposed-api" }
libxposed-service = { group = "io.github.libxposed", name = "service", version.ref = "xposed-service" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version = "1.5.0-rc01" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
